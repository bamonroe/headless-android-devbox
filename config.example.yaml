# -----------------------------------------------------------------------------
# Machine-specific config for the Android emulator + build scaffold.
#
# This is the TEMPLATE. Copy it to `config.yaml` and fill in YOUR values:
#     cp config.example.yaml config.yaml
# `config.yaml` is git-ignored — your real paths/IPs never get committed or
# published. Only this placeholder template lives in the repo, so the tooling is
# reusable by anyone who clones it. The scripts and the docs treat `config.yaml`
# as the single source of truth; nothing personal is hardcoded elsewhere.
#
# Schema: flat sections of `name: value` pairs. Read it with `config.sh`
# (`./config.sh get <section> <name>`). Keep the 2-space indentation.
# -----------------------------------------------------------------------------

# Physical adb targets: a friendly name -> the device's IP (usually a VPN/LAN
# address reachable over wireless debugging on port 5555). These are reference
# for `adb -s <ip>:5555 ...`; the emulator is separate and needs no entry.
devices:
  phone:  10.0.0.10        # e.g. your daily-driver phone
  tablet: 10.0.0.11        # e.g. a test tablet

# Named directories the tooling uses. `storage` is the only one the emulator
# strictly needs (the big disk where the SDK/AVD/system-images live). Add your
# own named paths freely — apps built here may find named dirs useful.
directories:
  storage: /srv/storage       # big disk; SDK + AVD live under <storage>/android
  scaffold: /srv/android      # this repo's checkout (the docker-compose dir)
  # bam-store: /srv/android/store  # OPTIONAL override; defaults to `store/` in this repo
  bam-store-apks: /srv/storage/app-store/apks  # its APK payload — big disk, never in git
  fdroid-repo: /srv/storage/fdroid          # fdroidserver repo dir (repo/, metadata/, index) — big disk
  fdroid-keystore: /srv/storage/fdroid-keys/keystore.p12  # repo SIGNING key — off git, back it up

# F-Droid repo settings. Used by the fdroid container/scripts to generate and
# sign the repo index; paths for them live in `directories` above.
fdroid:
  url: https://fdroid.example.com/repo   # public URL clients add as a repo
  name: My F-Droid Repo                  # repo display name
  description: Private APK repo          # repo description shown in clients
  keystore-alias: fdroidrepo             # key alias inside the keystore

# Generic passthrough environment variables for the tooling. Optional — leave
# empty, or add KEY: value pairs that scripts/containers should see.
environment:
  # EXAMPLE_TOKEN: changeme
