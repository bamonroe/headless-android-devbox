# TODO — active task list for this project.
#
# Single source of truth for active work (see CLAUDE.md -> documentation map).
# Edit through the todo skill so ids, ordering, and metadata stay consistent:
#   scripts/todo.sh <command>      (see .claude/skills/todo/SKILL.md)
# Hand-editing works too — it is plain TOML — but the skill keeps it tidy.

schema_version = 1

[meta]
title = "TODO"
kind = "todo"
purpose = "The live task list and journal for this project — active work only."
documentation_map = "CLAUDE.md"
archive = "FINISHED.toml"

[meta.rules]
add_proposed_work = "Add proposed work as a new task rather than losing it."
remove_dropped_items = "Remove dropped items with a one-line why."
finish_work = "When a task is fully finished (built, tested, documented), run `scripts/todo.sh done <id>` to move it to FINISHED.toml."
scope = "In bounds: the emulator scaffold, the disposable APK builder, the store-publish pipeline, and their docs. Out of bounds: the app projects themselves and the BAM Store repo — track their work in their own repos."

[[task]]
id = "merge-bam-store-into-data-android-as-the-single-android-home"
title = "Merge BAM Store into /data/android as the single Android home"
description = "Merge the BAM Store project (/data/bam-store) into this repo so /data/android becomes everything Android: the APK repository, the build tools (build.sh + Dockerfile.builder), and the headless emulator. Beyond a straight merge, the APK repo should become an F-Droid-style repo, which means bringing in an F-Droid repo container (index generation/signing, fdroidserver, serving the repo) alongside the existing store publisher. Scope out the migration path (repo layout, history, config.yaml keys, publish pipeline, docs) as child scope/task items before implementing."
status = "active"
level = "epic"
category = "feature"
urgency = "normal"
order = 5
created = 2026-08-05
tags = ["merge", "bam-store", "fdroid", "epic"]

[[task]]
id = "decide-the-fate-of-the-com-bam-store-client-under-f-droid"
title = "Decide the fate of the com.bam.store client under F-Droid"
description = "Investigate store/client (com.bam.store) to determine what it costs to point it at the signed F-Droid index-v2.json instead of the custom index.json, and weigh that against retiring it and using the standard F-Droid client. Look at how the client parses the index, handles installs, and whether it relies on fields F-Droid doesn't provide. Produce concrete tasks for whichever path is chosen; if the client is retired, one of them is removing it from this repo and unpublishing it from the store."
status = "active"
level = "scope"
category = "feature"
urgency = "normal"
order = 130
created = 2026-08-05
tags = []

